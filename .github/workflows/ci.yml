name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Global lock across all branches/PRs to protect dialer_dw_ci
concurrency:
  group: warehouse-ci
  cancel-in-progress: false

jobs:
  unit:
    name: Unit Tests (No Credentials)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Unit Tests
        run: |
          pytest -m "not integration"

  warehouse:
    name: Warehouse Integration Tests
    needs: unit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    env:
      GCP_PROJECT_ID: dialer-dw-prod
      DBT_DATASET: dialer_dw_ci
      DBT_PROJECT_DIR: ${{ github.workspace }}/dbt_project
      DBT_PROFILES_DIR: ${{ github.workspace }}/dbt_project

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to GCP via Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: '${{ secrets.GCP_WIF_PROVIDER }}'
          service_account: '${{ secrets.GCP_WIF_SA }}'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install All Dependencies (Pinned)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run dbt Build
        run: |
          dbt deps
          dbt build --target ci